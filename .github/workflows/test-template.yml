name: Test template

on:
  push:
    branches: [main]
  pull_request:

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        license: [MIT, Apache-2.0, BSD-3-Clause, GPL-3.0-or-later, none]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-dependency-glob: template/pyproject.toml.jinja
      - name: Configure git identity for the initial commit
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: Render template with default answers
        run: >-
          uvx copier copy --trust --defaults --vcs-ref HEAD
          --data author_name="CI" --data author_email="ci@example.com"
          --data license="${{ matrix.license }}"
          . "$RUNNER_TEMP/demo-project" 2>&1 | tee "$RUNNER_TEMP/render.log"
      # The initial-commit task retries after hook fixes, which would hide
      # template output that isn't hook-clean.
      - name: Check hooks passed on the first commit attempt
        run: "! grep -n Failed \"$RUNNER_TEMP/render.log\""
      - name: Check generated project
        working-directory: ${{ runner.temp }}/demo-project
        run: |
          make lint
          make test
          uv run demo-project
          git log --oneline
